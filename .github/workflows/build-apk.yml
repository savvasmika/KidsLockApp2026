name: Build and Export APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Export Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1 || true
          fi
          chmod +x ./gradlew || true

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          echo "Using Android SDK at: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

          mkdir -p "$SDK_ROOT/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_ROOT/licenses/android-sdk-license" || true
          echo "84831b9409646a753e30573bab4c9c9134d19a99" > "$SDK_ROOT/licenses/android-sdk-preview-license" || true
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK_ROOT/licenses/intel-android-extra-license" || true
          echo "601085b94cd77f0b54ff86406957099fed807233" > "$SDK_ROOT/licenses/google-gdk-license" || true

          SDKMGR=$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMGR" ]; then
            echo "Running sdkmanager: $SDKMGR"
            yes | "$SDKMGR" --licenses || true
            yes | "$SDKMGR" "platforms;android-36" || true
          fi

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore
          fi

      - name: Prepare Environment File
        run: |
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build Debug APK
        env:
          JAVA_OPTS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dksp.useKSP2=true"
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug -Djava.awt.headless=true -Dksp.useKSP2=true --stacktrace
          else
            gradle assembleDebug -Djava.awt.headless=true -Dksp.useKSP2=true --stacktrace
          fi

      - name: Locate Generated APK
        id: apk-path
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file was found"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KIDLOCK-debug-apk
          path: ${{ steps.apk-path.outputs.apk_path }}
          retention-days: 30
